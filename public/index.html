<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#F7F5F2" />
<title>Scout · Property Finder</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://images.unsplash.com" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=13" />
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"}}</script>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-metro" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 3h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM4 11h16M8 21l1-3M16 21l-1-3"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="16" cy="15" r="1" fill="currentColor"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7l6 6 4-4 8 8M14 17h7v-7"/></symbol>
<symbol id="i-paw" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="6" cy="9" r="2"/><circle cx="10" cy="5" r="2"/><circle cx="14" cy="5" r="2"/><circle cx="18" cy="9" r="2"/><path d="M12 9c-3 0-6 3-6 6a3 3 0 0 0 3 3c1 0 2-.5 3-.5s2 .5 3 .5a3 3 0 0 0 3-3c0-3-3-6-6-6z"/></g></symbol>
<symbol id="i-school" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 9l10-5 10 5-10 5-10-5zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5M22 9v6"/></symbol>
<symbol id="pf" viewBox="0 0 100 150"><circle cx="50" cy="50" r="50" fill="#EF5E4E"/><path d="M0 50 H50 V100 A50 50 0 0 1 0 50 Z" fill="#fff"/><path d="M0 100 H50 A50 50 0 0 1 0 150 Z" fill="#EF5E4E"/></symbol></svg>
<div class="stage">
<div class="device" id="device">
  <header class="topbar">
    <div class="brand">
      <svg class="pf-mark" viewBox="0 0 100 150" aria-hidden="true">
        <circle cx="50" cy="50" r="50" fill="#EF5E4E"/>
        <path d="M0 50 H50 V100 A50 50 0 0 1 0 50 Z" fill="#fff"/>
        <path d="M0 100 H50 A50 50 0 0 1 0 150 Z" fill="#EF5E4E"/>
      </svg>
      <span class="wordmark">Scout</span>
    </div>
    <div class="menu-wrap">
      <button class="reset" id="menuBtn" aria-label="Menu" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" data-action="restart">Start over</button>
        <div class="menu-label">Demo scenarios</div>
        <button role="menuitem" data-action="noresults">No results, then relax</button>
        <button role="menuitem" data-action="changeofmind">Change of mind</button>
      </div>
    </div>
  </header>

  <main class="scroll" id="scroll">
    <section class="empty loading" id="empty">
      <div class="orb-wrap"><div class="orb-shimmer" aria-hidden="true"></div><canvas class="orb" id="orb" width="440" height="440" aria-hidden="true"></canvas></div>
      <h1>What are you looking for?</h1>
      <p>Tell me what you need. I'll do the searching.</p>
      <div class="starters" id="starters">
        <button class="pill" data-text="A 2-bed to rent near DIFC, around 130k a year">2-bed near DIFC, around 130k</button>
        <button class="pill" data-text="Furnished 1-bed in Marina or JLT, I have a cat">Furnished 1-bed in Marina, I have a cat</button>
      </div>
    </section>
    <section class="thread" id="thread" hidden></section>
  </main>

  <footer class="dock" id="dock">
    <button class="brief" id="brief" hidden aria-label="What Scout has understood so far">
      <svg class="brief-icon" aria-hidden="true"><use href="#pf"/></svg>
      <span class="brief-text" id="briefText"></span>
      <span class="brief-chev" aria-hidden="true"></span>
    </button>
    <form class="composer" id="composer" autocomplete="off">
      <span class="hint" id="hint" aria-hidden="true"><span class="hint-text">Ask Scout…</span></span><input id="input" type="text" placeholder="Ask Scout…" enterkeyhint="send" />
      <button type="button" class="mic" id="mic" aria-label="Voice input"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
      <button type="submit" class="send" id="send" aria-label="Send"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button>
    </form>
  </footer>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-label="What Scout has understood">
    <div class="handle"></div>
    <h2>What I've understood</h2>
    <div class="sheet-body" id="sheetBody"></div>
    <p class="sheet-hint">Tap anything to change it, or just tell me.</p>
  </section>

  <div class="popover" id="popover" hidden>
    <button data-move="drop">Not important</button>
    <button data-move="change">Change</button>
    <button data-move="why">Why this?</button>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>
</div>
<script type="module" src="app.js?v=14"></script>
</body>
</html>
